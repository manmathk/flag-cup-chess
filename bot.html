<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flag Cup Chess — Bot Arena</title><style>:root{--bg:#312e2b;--p:#262522;--l:#ebecd0;--d:#779556;--g:#81b64c;--t:#eee;--m:#aaa}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#171614,#312e2b,#171614);color:var(--t);font-family:system-ui,sans-serif}.app{max-width:1320px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(520px,760px) 340px;gap:18px}.top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:900}.logo b{color:#9ccc65}.muted{color:var(--m);font-size:12px}.btn,select{background:#3b3936;color:var(--t);border:0;border-radius:7px;padding:9px 11px;font-weight:700}.btn{cursor:pointer}.primary{background:var(--g);color:#102008}.player{background:var(--p);padding:10px 12px;border-radius:7px;margin-bottom:7px;display:flex;justify-content:space-between;border:2px solid transparent}.active{border-color:var(--g)}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);box-shadow:0 12px 35px #0008}.sq{position:relative;display:grid;place-items:center;font-family:"Segoe UI Symbol","Noto Sans Symbols 2",sans-serif;font-size:clamp(38px,7vw,70px);user-select:none}.light{background:var(--l)}.dark{background:var(--d)}.last{background:#baca44!important}.check{background:#d9534f!important}.wp{color:#fff;text-shadow:0 2px 2px #333}.bp{color:#222;text-shadow:0 1px 1px #fff8}.coord{position:absolute;font-size:10px;font-weight:700;opacity:.7}.rank{top:3px;left:4px}.file{right:4px;bottom:3px}.light .coord{color:var(--d)}.dark .coord{color:var(--l)}.side{display:grid;gap:12px}.card{background:var(--p);padding:14px;border-radius:9px}.card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;color:#ccc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:5px;margin-bottom:9px}.field label{font-size:11px;color:var(--m)}select{width:100%;border:1px solid #555}.status{background:#171614;border-radius:7px;padding:10px;font-size:13px}.thinking{color:#f0c75e}.moves{max-height:300px;overflow:auto}.move{display:grid;grid-template-columns:36px 1fr 1fr;padding:5px 2px;border-bottom:1px solid #ffffff0d;font-size:13px}.num{color:#777}.eval{display:flex;gap:10px}.bar{height:170px;width:22px;background:#111;border-radius:4px;display:flex;align-items:flex-end;overflow:hidden}.fill{width:100%;height:50%;background:#eee}.result{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:5}.result.show{display:grid}.box{background:var(--p);padding:28px;border-radius:12px;text-align:center}@media(max-width:900px){.app{grid-template-columns:1fr}.top{grid-column:auto}}@media(max-width:600px){.app{padding:8px}.grid{grid-template-columns:1fr}.side{margin-top:10px}}</style></head><body><div class="app"><header class="top"><div><div class="logo">FLAG CUP <b>CHESS</b></div><div class="muted">BOT ARENA · legal chess bot vs bot</div></div><div><button class="btn" id="flip">Flip</button> <button class="btn primary" id="new">New game</button></div></header><main><div class="player" id="blackP"><b id="blackName">🇧🇷 Brazil Bot</b><span class="muted" id="blackInfo">Strength 3</span></div><div class="board" id="board"></div><div class="player" id="whiteP"><b id="whiteName">🇮🇳 India Bot</b><span class="muted" id="whiteInfo">Strength 3</span></div></main><aside class="side"><section class="card"><h3>Match</h3><div class="grid"><div class="field"><label>White</label><select id="white"><option value="ind">🇮🇳 India</option><option value="bra">🇧🇷 Brazil</option><option value="arg">🇦🇷 Argentina</option><option value="fra">🇫🇷 France</option><option value="ger">🇩🇪 Germany</option><option value="esp">🇪🇸 Spain</option><option value="usa">🇺🇸 USA</option><option value="jpn">🇯🇵 Japan</option></select></div><div class="field"><label>Black</label><select id="black"><option value="bra">🇧🇷 Brazil</option><option value="ind">🇮🇳 India</option><option value="arg">🇦🇷 Argentina</option><option value="fra">🇫🇷 France</option><option value="ger">🇩🇪 Germany</option><option value="esp">🇪🇸 Spain</option><option value="usa">🇺🇸 USA</option><option value="jpn">🇯🇵 Japan</option></select></div></div><div class="grid"><div class="field"><label>White strength</label><select id="ws"><option value="1">1 · Fast</option><option value="2">2 · Casual</option><option value="3" selected>3 · Strong</option><option value="4">4 · Deep</option></select></div><div class="field"><label>Black strength</label><select id="bs"><option value="1">1 · Fast</option><option value="2">2 · Casual</option><option value="3" selected>3 · Strong</option><option value="4">4 · Deep</option></select></div></div><div class="grid"><button class="btn" id="pause">Pause</button><button class="btn" id="speed">Speed: 1×</button></div></section><section class="card"><h3>Status</h3><div class="status" id="status">White to move</div></section><section class="card"><h3>Evaluation</h3><div class="eval"><div class="bar"><div class="fill" id="fill"></div></div><div><b id="evaluation">+0.00</b><div class="muted">White + / Black −</div></div></div></section><section class="card"><h3>Moves</h3><div class="moves" id="moves"></div></section></aside></div><div class="result" id="result"><div class="box"><h2 id="resultTitle"></h2><p id="resultText"></p><button class="btn primary" id="rematch">Rematch</button></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script><script>'use strict';const $=x=>document.getElementById(x),P={p:['♙','♟'],n:['♘','♞'],b:['♗','♝'],r:['♖','♜'],q:['♕','♛'],k:['♔','♚']},B={ind:'🇮🇳 India',bra:'🇧🇷 Brazil',arg:'🇦🇷 Argentina',fra:'🇫🇷 France',ger:'🇩🇪 Germany',esp:'🇪🇸 Spain',usa:'🇺🇸 USA',jpn:'🇯🇵 Japan'},V={p:100,n:320,b:330,r:500,q:900,k:20000};let g,flip=false,paused=false,spd=1,timer,last,token=0;function over(){return g.isGameOver?g.isGameOver():g.game_over()}function check(){return g.isCheck?g.isCheck():g.in_check()}function mate(){return g.isCheckmate?g.isCheckmate():g.in_checkmate()}function draw(){return g.isDraw?g.isDraw():g.in_draw()}function stale(){return g.isStalemate?g.isStalemate():g.in_stalemate()}function ev(c){if(mate())return g.turn()==='w'?-999999:999999;if(draw())return 0;let s=0;g.board().forEach((row,r)=>row.forEach((p,f)=>{if(p)s+=(p.color==='w'?1:-1)*V[p.type]}));return s}function search(c,d,a,b,max){if(!d||over())return ev(c);let ms=c.moves({verbose:true}),best=max?-Infinity:Infinity;for(const m of ms){c.move(m);let v=search(c,d-1,a,b,!max);c.undo();if(max){best=Math.max(best,v);a=Math.max(a,best)}else{best=Math.min(best,v);b=Math.min(b,best)}if(b<=a)break}return best}function choose(d){let ms=g.moves({verbose:true});if(!ms.length)return null;if(d===1)return ms[Math.random()*ms.length|0];let max=g.turn()==='w',best=max?-Infinity:Infinity,pool=[];for(const m of ms){g.move(m);let v=search(g,d-1,-Infinity,Infinity,!max);g.undo();v+=(Math.random()-.5)*10;if(max?v>best:v<best){best=v;pool=[m]}else if(Math.abs(v-best)<8)pool.push(m)}return pool[Math.random()*pool.length|0]||ms[0]}function render(){let b=$("board");b.innerHTML='';let d=g.board(),rs=flip?[0,1,2,3,4,5,6,7]:[7,6,5,4,3,2,1,0],fs=flip?[7,6,5,4,3,2,1,0]:[0,1,2,3,4,5,6,7];rs.forEach((r,ri)=>fs.forEach((f,fi)=>{let s=String.fromCharCode(97+f)+(r+1),p=d[7-r][f],e=document.createElement('div');e.className='sq '+(((r+f)&1)?'dark':'light');if(last&&(s===last.from||s===last.to))e.classList.add('last');if(p&&p.type==='k'&&p.color===g.turn()&&check())e.classList.add('check');if(p){let x=document.createElement('span');x.className=p.color==='w'?'wp':'bp';x.textContent=P[p.type][p.color==='w'?0:1];e.appendChild(x)}if(fi===0){let x=document.createElement('span');x.className='coord rank';x.textContent=r+1;e.appendChild(x)}if(ri===7){let x=document.createElement('span');x.className='coord file';x.textContent=String.fromCharCode(97+f);e.appendChild(x)}b.appendChild(e)}));$("whiteName").textContent=B[$("white").value]+' Bot';$("blackName").textContent=B[$("black").value]+' Bot';$("whiteInfo").textContent='Strength '+$("ws").value;$("blackInfo").textContent='Strength '+$("bs").value;$("whiteP").classList.toggle('active',g.turn()==='w'&&!paused);$("blackP").classList.toggle('active',g.turn()==='b'&&!paused);let e=Math.max(-10,Math.min(10,ev(g)/100));$("evaluation").textContent=(e>=0?'+':'')+e.toFixed(2);$("fill").style.height=(50+e*5)+'%'}function moves(){let h=g.history(),b=$("moves");b.innerHTML='';for(let i=0;i<h.length;i+=2){let x=document.createElement('div');x.className='move';x.innerHTML='<span class="num">'+(i/2+1)+'.</span><span>'+h[i]+'</span><span>'+(h[i+1]||'')+'</span>';b.appendChild(x)}b.scrollTop=b.scrollHeight}function end(){let title='Draw',text='The game is drawn.';if(mate()){let w=g.turn()==='w'?$("black").value:$("white").value;title=B[w]+' Bot wins';text='Checkmate.'}else if(stale())text='Stalemate.';$("resultTitle").textContent=title;$("resultText").textContent=text;$("result").classList.add('show');clearTimeout(timer)}function step(t){if(t!==token||paused)return;if(over()){end();return}let side=g.turn(),d=+(side==='w'?$("ws").value:$("bs").value);$("status").textContent=(side==='w'?'White':'Black')+' bot is thinking…';$("status").className='status thinking';render();setTimeout(()=>{if(t!==token||paused)return;let m=choose(d);if(!m){end();return}last=g.move(m);moves();render();if(over()){end();return}$("status").className='status';$("status").textContent=(g.turn()==='w'?'White':'Black')+(check()?' · CHECK':'')+' to move';timer=setTimeout(()=>step(t),Math.max(120,700/spd))},Math.max(100,450/spd))}function start(){token++;clearTimeout(timer);g=new Chess();last=null;paused=false;$("pause").textContent='Pause';$("result").classList.remove('show');render();moves();$("status").className='status';$("status").textContent='White to move';timer=setTimeout(()=>step(token),400)}$("new").onclick=start;$("rematch").onclick=start;$("flip").onclick=()=>{flip=!flip;render()};$("pause").onclick=()=>{paused=!paused;$("pause").textContent=paused?'Resume':'Pause';render();if(!paused)step(token)};$("speed").onclick=()=>{spd=spd===1?2:spd===2?4:1;$("speed").textContent='Speed: '+spd+'×'};['white','black','ws','bs'].forEach(id=>$(id).onchange=render);start();</script></body></html>
