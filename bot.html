<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FLAG CUP CHESS · Bot Arena</title>
<style>
:root{--bg:#0b0f14;--panel:#121821;--panel2:#1a222d;--line:#2a3542;--text:#eef2f7;--muted:#93a0af;--green:#81b64c;--green2:#a3d165;--light:#f0d9b5;--dark:#b58863;--danger:#e55353;--gold:#d8b45a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1b2633 0,#0b0f14 45%,#070a0e 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,select{font:inherit}button{cursor:pointer}.app{max-width:1450px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(560px,760px) 360px;gap:20px;align-items:start}.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:800;letter-spacing:.04em}.brand span{color:var(--green2)}.sub{color:var(--muted);font-size:12px;margin-top:3px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 13px;border-radius:8px;font-weight:700}.btn:hover{background:var(--panel2)}.btn.primary{background:var(--green);border-color:var(--green);color:#10200a}.board-wrap{position:relative}.players{display:grid;gap:8px;margin-bottom:8px}.player{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between}.player.active{border-color:var(--green);box-shadow:0 0 0 1px rgba(129,182,76,.2)}.player .name{font-weight:800;display:flex;gap:9px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:#657181}.active .dot{background:var(--green2);box-shadow:0 0 10px rgba(163,209,101,.7)}.rating{color:var(--muted);font-size:12px}.clock{font-size:20px;font-variant-numeric:tabular-nums;font-weight:800}.board{width:min(100%,760px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:5px solid #111820;border-radius:4px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45)}.sq{position:relative;display:grid;place-items:center;font-family:"Segoe UI Symbol","Noto Sans Symbols 2",sans-serif;font-size:clamp(35px,7vw,68px);line-height:1;user-select:none}.sq.light{background:var(--light)}.sq.dark{background:var(--dark)}.sq.last{box-shadow:inset 0 0 0 999px rgba(246,246,91,.25)}.sq.check{box-shadow:inset 0 0 0 999px rgba(220,65,55,.55)}.piece{filter:drop-shadow(0 2px 1px rgba(0,0,0,.5));transform:translateY(-2px)}.white-piece{color:#fff;text-shadow:0 2px 0 #555,0 0 2px #222}.black-piece{color:#171717;text-shadow:0 1px 0 #ddd,0 0 2px #000}.coord{position:absolute;font:700 10px/1 system-ui;opacity:.7}.file{right:4px;bottom:3px}.rank{left:4px;top:3px}.light .coord{color:#8b6b48}.dark .coord{color:#f0d9b5}.side{display:grid;gap:12px}.card{background:rgba(18,24,33,.94);border:1px solid var(--line);border-radius:12px;padding:14px}.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#b7c2ce;margin:0 0 12px}.controls{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:grid;gap:5px}.field label{font-size:11px;color:var(--muted)}select{background:#0d131b;border:1px solid var(--line);color:var(--text);padding:9px;border-radius:7px}.status{display:flex;align-items:center;gap:8px;padding:10px;background:#0d131b;border-radius:8px;color:#c9d2dc;font-size:13px}.pulse{width:8px;height:8px;border-radius:50%;background:var(--green2);animation:pulse 1s infinite}.moves{max-height:310px;overflow:auto}.move-row{display:grid;grid-template-columns:38px 1fr 1fr;gap:5px;padding:5px 3px;border-bottom:1px solid rgba(255,255,255,.045);font-size:13px}.move-row .n{color:#697687}.eval{height:180px;display:flex;gap:8px}.evalbar{width:24px;background:#f3f3f3;border-radius:5px;overflow:hidden;display:flex;align-items:flex-end}.evalfill{background:#222;width:100%;height:50%;transition:height .3s}.evalnum{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.result{position:absolute;inset:0;display:none;place-items:center;background:rgba(4,7,10,.72);backdrop-filter:blur(5px);z-index:4}.result.show{display:grid}.result-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 34px;text-align:center;box-shadow:0 20px 70px #000}.result-box h1{margin:0 0 8px;font-size:34px}.result-box p{color:var(--muted);margin:0 0 18px}.hint{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}@keyframes pulse{50%{opacity:.35}}@media(max-width:1000px){.app{grid-template-columns:1fr;max-width:820px}.side{grid-template-columns:1fr 1fr}.top{grid-column:auto}}@media(max-width:650px){.app{padding:9px;display:block}.top{margin-bottom:12px}.side{margin-top:12px;display:grid;grid-template-columns:1fr}.actions .btn:not(.primary){display:none}.sq{font-size:clamp(30px,11vw,55px)}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div><div class="brand">FLAG CUP <span>CHESS</span></div><div class="sub">BOT ARENA · automated chess battles</div></div><div class="actions"><button class="btn" id="flip">Flip board</button><button class="btn primary" id="new">New game</button></div></header>
  <main class="board-wrap">
    <div class="players">
      <div class="player" id="blackPlayer"><div class="name"><i class="dot"></i><span id="blackName">Brazil Bot</span></div><div><span class="rating" id="blackDepth">Depth 3</span> <span class="clock" id="blackClock">∞</span></div></div>
    </div>
    <div class="board" id="board"></div>
    <div class="players" style="margin-top:8px"><div class="player" id="whitePlayer"><div class="name"><i class="dot"></i><span id="whiteName">India Bot</span></div><div><span class="rating" id="whiteDepth">Depth 3</span> <span class="clock" id="whiteClock">∞</span></div></div></div>
    <div class="hint">Every move is generated by the same legal chess engine used by the tournament.</div>
    <div class="result" id="result"><div class="result-box"><h1 id="resultTitle">Game over</h1><p id="resultText"></p><button class="btn primary" id="rematch">Rematch</button></div></div>
  </main>
  <aside class="side">
    <section class="card"><h2>Match controls</h2><div class="controls"><div class="row"><div class="field"><label>White bot</label><select id="white"><option value="ind">🇮🇳 India</option><option value="bra">🇧🇷 Brazil</option><option value="arg">🇦🇷 Argentina</option><option value="fra">🇫🇷 France</option><option value="ger">🇩🇪 Germany</option><option value="esp">🇪🇸 Spain</option><option value="usa">🇺🇸 USA</option><option value="jpn">🇯🇵 Japan</option></select></div><div class="field"><label>Black bot</label><select id="black"><option value="bra">🇧🇷 Brazil</option><option value="ind">🇮🇳 India</option><option value="arg">🇦🇷 Argentina</option><option value="fra">🇫🇷 France</option><option value="ger">🇩🇪 Germany</option><option value="esp">🇪🇸 Spain</option><option value="usa">🇺🇸 USA</option><option value="jpn">🇯🇵 Japan</option></select></div></div><div class="row"><div class="field"><label>White strength</label><select id="wd"><option value="1">1 · Fast</option><option value="2">2 · Casual</option><option value="3" selected>3 · Strong</option><option value="4">4 · Deep</option></select></div><div class="field"><label>Black strength</label><select id="bd"><option value="1">1 · Fast</option><option value="2">2 · Casual</option><option value="3" selected>3 · Strong</option><option value="4">4 · Deep</option></select></div></div><div class="row"><button class="btn" id="pause">Pause</button><button class="btn" id="speed">Speed: 1×</button></div></div></section>
    <section class="card"><h2>Game status</h2><div class="status"><span class="pulse" id="pulse"></span><span id="status">White to move</span></div></section>
    <section class="card"><h2>Evaluation</h2><div class="eval"><div class="evalbar"><div class="evalfill" id="evalfill"></div></div><div><div class="evalnum" id="eval">0.00</div><div class="sub" style="margin-top:5px">White advantage +</div></div></div></section>
    <section class="card"><h2>Moves</h2><div class="moves" id="moves"></div></section>
  </aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/chess.js@0.13.4/chess.min.js"></script>
<script type="module">
import { chooseBotMove, evaluateBoard, isCheckmate, isDraw, isGameOver, nationById, NATIONS } from './engine.js';
const PIECES={p:['♙','♟'],n:['♘','♞'],b:['♗','♝'],r:['♖','♜'],q:['♕','♛'],k:['♔','♚']};
const $=id=>document.getElementById(id); let chess, timer, paused=false, flipped=false, speed=1, lastMove=null, gameToken=0;
const rng=()=>Math.random();
function nation(id){return nationById(id)||NATIONS.find(n=>n.id===id)||{name:id,depth:3};}
function render(){
 const board=$('board'); board.innerHTML=''; const data=chess.board();
 const ranks=flipped?[0,1,2,3,4,5,6,7]:[7,6,5,4,3,2,1,0], files=flipped?[7,6,5,4,3,2,1,0]:[0,1,2,3,4,5,6,7];
 ranks.forEach((r,ri)=>files.forEach((f,fi)=>{const sq=String.fromCharCode(97+f)+(r+1), p=data[7-r][f], el=document.createElement('div'); el.className='sq '+(((r+f)&1)?'dark':'light'); if(lastMove&&(sq===lastMove.from||sq===lastMove.to))el.classList.add('last'); if(p&&p.type==='k'&&p.color===chess.turn()&&isInCheck())el.classList.add('check');
 if(p){const s=document.createElement('span');s.className='piece '+(p.color==='w'?'white-piece':'black-piece');s.textContent=PIECES[p.type][p.color==='w'?0:1];el.appendChild(s)}
 if(fi===0){const c=document.createElement('span');c.className='coord rank';c.textContent=r+1;el.appendChild(c)} if(ri===7){const c=document.createElement('span');c.className='coord file';c.textContent=String.fromCharCode(97+f);el.appendChild(c)} board.appendChild(el)}));
 const w=nation($('white').value),b=nation($('black').value); $('whiteName').textContent=w.name+' Bot'; $('blackName').textContent=b.name+' Bot'; $('whiteDepth').textContent='Depth '+$('wd').value; $('blackDepth').textContent='Depth '+$('bd').value;
 $('whitePlayer').classList.toggle('active',chess.turn()==='w'&&!paused);$('blackPlayer').classList.toggle('active',chess.turn()==='b'&&!paused);
 const e=evaluateBoard(chess)/100; $('eval').textContent=(e>=0?'+':'')+e.toFixed(2); $('evalfill').style.height=(Math.max(0,Math.min(100,50+e*5)))+'%';
}
function isInCheck(){return typeof chess.isCheck==='function'?chess.isCheck():chess.in_check()}
function movesRender(){const box=$('moves');box.innerHTML='';const h=chess.history();for(let i=0;i<h.length;i+=2){const row=document.createElement('div');row.className='move-row';row.innerHTML=`<span class="n">${i/2+1}.</span><span>${h[i]||''}</span><span>${h[i+1]||''}</span>`;box.appendChild(row)}box.scrollTop=box.scrollHeight}
function status(){if(isCheckmate(chess)){const winner=chess.turn()==='w'?nation($('black').value).name:nation($('white').value).name;end(winner+' Bot wins','Checkmate.');return true}if(isDraw(chess)||isGameOver(chess)){end('Draw','The position is drawn.');return true}$('status').textContent=(chess.turn()==='w'?'White':'Black')+' to move'+(isInCheck()?' · CHECK':'');return false}
function end(title,text){clearTimeout(timer);$('resultTitle').textContent=title;$('resultText').textContent=text;$('result').classList.add('show');$('pulse').style.background='var(--gold)'}
async function think(token){if(token!==gameToken||paused)return;if(status())return; const color=chess.turn(), id=color==='w'?$('white').value:$('black').value, depth=Number(color==='w'?$('wd').value:$('bd').value); $('status').textContent=(color==='w'?'White':'Black')+' bot is thinking…';$('pulse').style.background='var(--gold)';render(); await new Promise(r=>setTimeout(r,Math.max(180,700/speed))); if(token!==gameToken||paused)return; const move=chooseBotMove(chess,depth,rng);if(!move){status();return}const played=chess.move(move);lastMove=played;movesRender();render();$('pulse').style.background='var(--green2)'; if(status())return; timer=setTimeout(()=>think(token),Math.max(250,900/speed));}
function start(){gameToken++;clearTimeout(timer);paused=false;$('pause').textContent='Pause';$('result').classList.remove('show');$('pulse').style.background='var(--green2)';lastMove=null;chess=new Chess();render();movesRender();$('status').textContent='White to move';timer=setTimeout(()=>think(gameToken),500)}
$('new').onclick=start;$('rematch').onclick=start;$('flip').onclick=()=>{flipped=!flipped;render()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause';if(!paused){think(gameToken)}else{clearTimeout(timer);$('status').textContent='Paused';render()}};$('speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;$('speed').textContent='Speed: '+speed+'×'};['white','black','wd','bd'].forEach(id=>$(id).addEventListener('change',()=>{render()}));start();
</script>
</body>
</html>
